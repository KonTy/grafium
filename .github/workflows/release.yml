name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-version:
    runs-on: ubuntu-22.04
    outputs:
      semver: ${{ steps.version.outputs.semver }}
      tag: ${{ steps.version.outputs.tag }}
      is_tag_build: ${{ steps.version.outputs.is_tag_build }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute CI version
        id: version
        run: |
          set -euo pipefail

          CURRENT=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
            SEMVER="${TAG#v}"
            echo "is_tag_build=true" >> "$GITHUB_OUTPUT"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            PATCH=$((PATCH + ${{ github.run_number }}))
            SEMVER="$MAJOR.$MINOR.$PATCH"
            TAG="v$SEMVER"
            echo "is_tag_build=false" >> "$GITHUB_OUTPUT"
          fi

          echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build-linux:
    needs: [prepare-version]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Apply CI version
        run: |
          set -euo pipefail
          VER="${{ needs.prepare-version.outputs.semver }}"
          sed -i -E 's/^version = "[0-9]+\.[0-9]+\.[0-9]+"/version = "'"$VER"'"/' Cargo.toml
          sed -i -E '0,/^version = "[0-9]+\.[0-9]+\.[0-9]+"/s//version = "'"$VER"'"/' ui/src-tauri/Cargo.toml
          sed -i -E 's/"version": "[0-9]+\.[0-9]+\.[0-9]+"/"version": "'"$VER"'"/' ui/src-tauri/tauri.conf.json
          sed -i -E 's/"version": "[0-9]+\.[0-9]+\.[0-9]+"/"version": "'"$VER"'"/' ui/package.json

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libappindicator3-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ui/src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ui
          tauriScript: npx tauri

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage

  build-windows:
    needs: [prepare-version]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply CI version
        shell: pwsh
        run: |
          $ver = "${{ needs.prepare-version.outputs.semver }}"
          (Get-Content Cargo.toml) -replace '^version = "\d+\.\d+\.\d+"', "version = \"$ver\"" | Set-Content Cargo.toml

          $tauriCargo = Get-Content ui/src-tauri/Cargo.toml
          $updated = $false
          for ($i = 0; $i -lt $tauriCargo.Count; $i++) {
            if (-not $updated -and $tauriCargo[$i] -match '^version = "\d+\.\d+\.\d+"') {
              $tauriCargo[$i] = "version = \"$ver\""
              $updated = $true
            }
          }
          $tauriCargo | Set-Content ui/src-tauri/Cargo.toml

          (Get-Content ui/src-tauri/tauri.conf.json) -replace '"version": "\d+\.\d+\.\d+"', "\"version\": \"$ver\"" | Set-Content ui/src-tauri/tauri.conf.json
          (Get-Content ui/package.json) -replace '"version": "\d+\.\d+\.\d+"', "\"version\": \"$ver\"" | Set-Content ui/package.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ui/src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ui
          tauriScript: npx tauri

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi

  build-android:
    needs: [prepare-version]
    runs-on: ubuntu-22.04
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Apply CI version
        run: |
          set -euo pipefail
          VER="${{ needs.prepare-version.outputs.semver }}"
          sed -i -E 's/^version = "[0-9]+\.[0-9]+\.[0-9]+"/version = "'"$VER"'"/' Cargo.toml
          sed -i -E '0,/^version = "[0-9]+\.[0-9]+\.[0-9]+"/s//version = "'"$VER"'"/' ui/src-tauri/Cargo.toml
          sed -i -E 's/"version": "[0-9]+\.[0-9]+\.[0-9]+"/"version": "'"$VER"'"/' ui/src-tauri/tauri.conf.json
          sed -i -E 's/"version": "[0-9]+\.[0-9]+\.[0-9]+"/"version": "'"$VER"'"/' ui/package.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;27.0.12077973"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ui/src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Initialize Tauri Android
        working-directory: ui
        run: npx tauri android init

      - name: Build Android APK
        working-directory: ui
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: npx tauri android build --apk

      - name: Sign Android APK
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(find ui/src-tauri/gen/android -name '*-release-unsigned.apk' | head -1)
          SIGNED="ui/src-tauri/gen/android/Grafium-release.apk"
          "$BUILD_TOOLS/zipalign" -f 4 "$UNSIGNED" "$SIGNED"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass env:ANDROID_KEY_PASSWORD \
            "$SIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose "$SIGNED"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: |
            ui/src-tauri/gen/android/Grafium-release.apk
            ui/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

  release:
    needs: [prepare-version, build-linux, build-windows, build-android]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-version.outputs.tag }}
          name: Grafium ${{ needs.prepare-version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/linux-artifacts/**/*
            artifacts/windows-artifacts/**/*
            artifacts/android-artifacts/**/Grafium-release.apk
            artifacts/android-artifacts/**/*-release-unsigned.apk
