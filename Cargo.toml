[workspace]
members = ["core", "ui/src-tauri", "tui"]
resolver = "2"

[workspace.package]
version = "0.0.105"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
rusqlite = { version = "0.31", features = ["bundled", "vtab", "backup", "functions"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
