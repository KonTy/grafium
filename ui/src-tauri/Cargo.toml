[package]
name = "grafium"
version = "0.0.105"
license = "MIT"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["custom-protocol", "devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
notify = "6"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
urlencoding = "2"
base64 = "0.22"

# Embedded local transcription (Whisper) + local LLM (llama.cpp) inference.
# Excluded on Android: cross-compiling their C++ builds (whisper.cpp,
# llama.cpp) for 3 Android ABIs is untested and risky, and Android already
# has its own on-device NLU path (see android_jni.rs) that doesn't need
# either. Desktop targets get both so the app is genuinely zero-setup —
# no external server process for users to start themselves.
[target.'cfg(not(target_os = "android"))'.dependencies]
grafium_core = { path = "../../core", package = "grafium-core", features = ["media", "llm-local"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0.2"
gtk = "0.18"
gdk = "0.18"

[target.'cfg(target_os = "android")'.dependencies]
grafium_core = { path = "../../core", package = "grafium-core" }
# JNI bindings so the Android AssistantReceiver can call the shared Rust
# NLU (grafium_core::assistant) instead of duplicating the grammar in Kotlin.
jni = "0.21"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "grafium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
