<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Grafium chain links logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#3a506b" />
    </linearGradient>
    <linearGradient id="metalA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fbff" />
      <stop offset="100%" stop-color="#aac6e8" />
    </linearGradient>
    <linearGradient id="metalB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9fd4ff" />
      <stop offset="100%" stop-color="#e6f4ff" />
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="110" fill="url(#bg)" />

  <g transform="rotate(-20 256 256)" filter="url(#softShadow)">
    <rect x="108" y="162" width="210" height="124" rx="62" fill="none" stroke="url(#metalA)" stroke-width="36" />
    <rect x="194" y="226" width="210" height="124" rx="62" fill="none" stroke="url(#metalB)" stroke-width="36" />
  </g>

  <circle cx="352" cy="118" r="56" fill="#6fffe9" fill-opacity="0.15" />
  <circle cx="116" cy="392" r="42" fill="#5bc0be" fill-opacity="0.12" />
</svg>
