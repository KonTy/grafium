<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title description">
  <title id="title">Gravity and sideways motion in an orbit</title>
  <desc id="description">An original schematic: a satellite above a central body moves to the right while gravity points downward toward the center. Not to scale.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#2563eb"/></marker>
    <marker id="arrow-orange" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#b45309"/></marker>
  </defs>
  <rect width="640" height="360" rx="20" fill="#f8fafc"/>
  <ellipse cx="300" cy="195" rx="190" ry="115" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 7"/>
  <circle cx="300" cy="195" r="35" fill="#155e75"/>
  <text x="300" y="253" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">central body</text>
  <circle cx="300" cy="80" r="10" fill="#334155"/>
  <line x1="316" y1="80" x2="434" y2="80" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="365" y="56" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#1d4ed8">sideways motion</text>
  <line x1="300" y1="96" x2="300" y2="147" stroke="#b45309" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <text x="279" y="132" text-anchor="end" font-family="sans-serif" font-size="17" fill="#92400e">gravity</text>
  <text x="320" y="338" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#475569">Direction sketch · not to scale</text>
</svg>
