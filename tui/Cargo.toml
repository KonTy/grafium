[package]
name = "grafium-tui"
version.workspace = true
edition.workspace = true

[[bin]]
name = "grafium-tui"
path = "src/main.rs"

[dependencies]
grafium-core = { path = "../core" }
ratatui = "0.30"
crossterm = "0.29"
ratatui-textarea = { version = "0.9", features = ["crossterm"], default-features = false }
pulldown-cmark = "0.10"
anyhow = "1"
serde_json = "1"
unicode-width = "0.2"
